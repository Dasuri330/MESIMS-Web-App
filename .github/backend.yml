name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'mesims-api/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'mesims-api/**'

jobs:
  build-and-test:
    name: Install and verify FastAPI app
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mesims-api

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mesims-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify the app imports cleanly
        run: python -c "from app.main import app; print('FastAPI app loaded OK')"

      # Uncomment once pytest tests exist under mesims-api/tests/
      # - name: Run tests
      #   run: pytest
