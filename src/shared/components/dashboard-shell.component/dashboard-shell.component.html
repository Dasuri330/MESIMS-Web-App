<div class="shell">
  <aside class="shell__sidebar">
    <div class="shell__brand">
      <span class="shell__brand-mark">M</span>
      <span class="shell__brand-name">MESIMS</span>
    </div>

    <nav class="shell__nav">
      @for (item of navItems(); track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="shell__nav-link--active"
          class="shell__nav-link"
        >
          <i class="bi {{ item.icon }}" aria-hidden="true"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <a routerLink="/" class="shell__nav-link shell__nav-link--logout">
      <i class="bi bi-box-arrow-left" aria-hidden="true"></i>
      <span>Sign out</span>
    </a>
  </aside>

  <div class="shell__main">
    <header class="shell__topbar">
      <span class="badge text-bg-light border">{{ roleLabel() }}</span>

      <div class="shell__profile">
        <button
          type="button"
          class="shell__profile-trigger"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen()"
        >
          <span class="shell__avatar" aria-hidden="true">{{ userName().charAt(0) }}</span>
          <span class="d-none d-sm-inline">{{ userName() }}</span>
          <i class="bi bi-chevron-down small" aria-hidden="true"></i>
        </button>

        @if (menuOpen()) {
          <div class="shell__profile-menu">
            @if (profileRoute()) {
              <a
                [routerLink]="profileRoute()"
                class="shell__profile-menu-item"
                (click)="closeMenu()"
              >
                <i class="bi bi-person-circle" aria-hidden="true"></i>
                Edit profile
              </a>
            }
            <a routerLink="/" class="shell__profile-menu-item">
              <i class="bi bi-box-arrow-left" aria-hidden="true"></i>
              Sign out
            </a>
          </div>
        }
      </div>
    </header>

    <div class="shell__content">
      <ng-content />
    </div>
  </div>
</div>
