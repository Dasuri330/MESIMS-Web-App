<app-dashboard-shell
  roleLabel="Administrator"
  userName="Rafael Cruz"
  [navItems]="navItems"
>
  <div class="d-flex align-items-start justify-content-between mb-4">
    <div>
      <h1 class="h4 fw-semibold mb-1">Manage accounts</h1>
      <p class="text-secondary-emphasis mb-0">
        Create login credentials and manage access for teachers, parents, and students.
      </p>
    </div>

    <button type="button" class="btn btn-primary">
      <i class="bi bi-person-plus me-1" aria-hidden="true"></i>
      Create account
    </button>
  </div>

  <div class="btn-group mb-3" role="group">
    <button
      type="button"
      class="btn btn-sm"
      [class.btn-primary]="activeFilter() === 'ALL'"
      [class.btn-outline-secondary]="activeFilter() !== 'ALL'"
      (click)="setFilter('ALL')"
    >
      All
    </button>

    <button
      type="button"
      class="btn btn-sm"
      [class.btn-primary]="activeFilter() === 'TEACHER'"
      [class.btn-outline-secondary]="activeFilter() !== 'TEACHER'"
      (click)="setFilter('TEACHER')"
    >
      Teachers
    </button>

    <button
      type="button"
      class="btn btn-sm"
      [class.btn-primary]="activeFilter() === 'PARENT'"
      [class.btn-outline-secondary]="activeFilter() !== 'PARENT'"
      (click)="setFilter('PARENT')"
    >
      Parents
    </button>

    <button
      type="button"
      class="btn btn-sm"
      [class.btn-primary]="activeFilter() === 'STUDENT'"
      [class.btn-outline-secondary]="activeFilter() !== 'STUDENT'"
      (click)="setFilter('STUDENT')"
    >
      Students
    </button>
  </div>

  <div class="card border-0 shadow-sm color">
    <p-table
      [value]="filteredAccounts().slice()"
      dataKey="id"
      [tableStyle]="{ 'min-width': '60rem' }"
    >
      <ng-template #header>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Login email</th>
          <th>Status</th>
          <th class="text-end">Actions</th>
        </tr>
      </ng-template>

      <ng-template #body let-account>
        <tr>
          <td>
            <span class="fw-medium">
              {{ account.name }}
            </span>
          </td>

          <td>
            <p-tag
              [value]="account.role"
              [severity]="getRoleSeverity(account.role)"
            />
          </td>

          <td class="text-secondary-emphasis small">
            {{ account.email || 'Contacted via SMS' }}
          </td>

          <td>
            <p-tag
              [value]="account.status === 'active' ? 'Active' : 'Suspended'"
              [severity]="getStatusSeverity(account.status)"
            />
          </td>

          <td class="text-end">
            <button
              type="button"
              class="btn btn-sm btn-outline-secondary me-1"
              title="Edit account"
            >
              <i class="bi bi-pencil" aria-hidden="true"></i>
            </button>

            <button
              type="button"
              class="btn btn-sm btn-outline-secondary me-1"
              title="Reset password"
            >
              <i class="bi bi-key" aria-hidden="true"></i>
            </button>

            <button
              type="button"
              class="btn btn-sm"
              [class.btn-outline-danger]="account.status === 'active'"
              [class.btn-outline-success]="account.status === 'suspended'"
              [title]="
                account.status === 'active'
                  ? 'Suspend account'
                  : 'Reactivate account'
              "
              (click)="toggleStatus(account.id)"
            >
              <i
                class="bi"
                [class.bi-slash-circle]="account.status === 'active'"
                [class.bi-check-circle]="account.status === 'suspended'"
                aria-hidden="true"
              ></i>
            </button>
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="text-center py-4 text-secondary">
            No accounts found.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</app-dashboard-shell>
